# 只给成功返回的指纹资源长缓存；旧版本源码归档和 404 不能被当作永久静态缓存。
map "$status:$uri" $toolbox_cache_control {
    default "no-store";
    "~^(?:200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9.]+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    access_log off;
    error_log /dev/stderr warn;
    etag on;
    client_max_body_size 1k;

    # 本服务只提供静态文件，不接收用户文件，也不提供转换或写入接口。
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Cache-Control $toolbox_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        try_files $uri =404;
    }

    # 精确声明运行资源 MIME；新增 types 只作用于对应扩展名，不覆盖 CSS/图片等继承类型。
    location ~* \.(?:js|mjs)$ {
        types { application/javascript js mjs; }
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location ~* \.map$ {
        types { application/json map; }
        try_files $uri =404;
    }
    location ~* \.zip$ {
        types { application/zip zip; }
        try_files $uri =404;
    }
    location ~* \.(?:tar\.gz|tgz|gz)$ {
        types { application/gzip gz tgz; }
        try_files $uri =404;
    }
    location ~* \.tar$ {
        types { application/x-tar tar; }
        try_files $uri =404;
    }

    # 缺失资源明确 404，不把 HTML 回退伪装为 JavaScript、Worker 或下载文件。
    location /assets/ {
        try_files $uri =404;
    }
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # 只有应用路由回退到入口，刷新工具深链接仍返回 SPA；入口的现有 CSP 原样保留。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
