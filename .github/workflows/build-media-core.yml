name: Build pinned media core

on:
  workflow_dispatch:
    inputs:
      sdk_only:
        description: "Only inspect pinned SDK identity; do not compile or publish"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: media-core-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ixiaoyy/parallel-lines-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NO_PROXY: localhost,127.0.0.1,::1
      SDK_ONLY: ${{ inputs.sdk_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check approved public target and immutable release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO --jq '.private')" = false
          python3 scripts/media-core/prepare.py --validate-lock
          TAG=$(python3 -c 'import json; print(json.load(open("core-build.lock.json"))["release_tag"])')
          echo "CORE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p .media-core
          if [ "$SDK_ONLY" = false ]; then
            for endpoint in "git/ref/tags/$TAG" "releases/tags/$TAG"; do
              if gh api "repos/$GH_REPO/$endpoint" --silent 2>.media-core/release-preflight.log; then
                echo 'Refusing to overwrite existing core tag or release.' >&2
                exit 1
              elif ! grep -q 'HTTP 404' .media-core/release-preflight.log; then
                cat .media-core/release-preflight.log >&2
                exit 1
              fi
            done
          fi
      - name: Inspect pinned SDK before any compilation
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(python3 -c 'import json; print(json.load(open("core-build.lock.json"))["sdk"]["image"])')
          status=0
          timeout 5m docker run --rm --platform linux/amd64 --network none --cpus=2 \
            --entrypoint python3 \
            -v "$PWD/scripts/media-core/sdk-identity.py:/sdk-identity.py:ro" \
            -v "$PWD/core-build.lock.json:/input-lock.json:ro" \
            "$SDK" /sdk-identity.py > .media-core/sdk-identity.json || status=$?
          cat .media-core/sdk-identity.json
          exit "$status"
      - name: Prepare pinned preferred source and offline build context
        if: ${{ !inputs.sdk_only }}
        shell: bash
        run: timeout 30m python3 scripts/media-core/prepare.py --output .media-core
      - name: Build single-thread core with two-job bounds
        if: ${{ !inputs.sdk_only }}
        shell: bash
        run: |
          set -euo pipefail
          BUILDER=$(python3 -c 'import json; print(json.load(open("core-build.lock.json"))["builder"])')
          docker buildx version
          docker buildx create --name pl-media-core --use --driver docker-container \
            --driver-opt "image=$BUILDER" --driver-opt memory=6g \
            --driver-opt cpu-period=100000 --driver-opt cpu-quota=200000 \
            --buildkitd-config scripts/media-core/buildkitd.toml
          timeout 130m docker buildx build --platform linux/amd64 --progress plain \
            --build-arg FFMPEG_ST=yes --build-arg FFMPEG_MT= \
            --build-arg 'EXTRA_CFLAGS=-O3 -msimd128' \
            --output type=local,dest=.media-core/output \
            --file .media-core/source/Dockerfile .media-core/source \
            2>&1 | tee .media-core/build.log
          if grep -Eq 'function signature mismatch: x265(_10bit|_12bit)?_cpu_xgetbv' .media-core/build.log; then
            echo 'Known x265 ABI mismatch remains; refusing publication.' >&2
            exit 1
          fi
          python3 scripts/media-core/finalize.py --output .media-core
      - name: Save source and pending receipt in an unpublished draft before QA
        timeout-minutes: 10
        if: ${{ !inputs.sdk_only }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$CORE_TAG" --draft --target "$GITHUB_SHA" \
            --title "Pending QA media core $CORE_TAG" \
            --notes 'Unpublished build checkpoint: complete source and pending receipt. Not approved for public deployment.'
          gh release upload "$CORE_TAG" .media-core/release/*
      - uses: actions/setup-node@v4
        if: ${{ !inputs.sdk_only }}
        with:
          node-version: '22'
      - name: Build toolbox with this core and verify real media output
        if: ${{ !inputs.sdk_only }}
        shell: bash
        env:
          TOOLBOX_MEDIA_CORE_DIR: .media-core/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/media-core/probe-media.mjs
          npm run build
          npx playwright test --config scripts/media-core/playwright.config.ts --grep 'FFmpeg本地核心实际处理音频'
          python3 scripts/media-core/finalize.py --output .media-core --record-browser
      - name: Publish only after fresh UI and codec QA passes
        timeout-minutes: 5
        if: ${{ !inputs.sdk_only }}
        shell: bash
        run: |
          set -euo pipefail
          # REST by-tag 只找已发布版本；CLI 同时支持按 pending tag 查未公开草稿。
          gh release view "$CORE_TAG" --json isDraft,tagName,targetCommitish \
            --jq '{draft:.isDraft,tag_name:.tagName,target_commitish:.targetCommitish}' > .media-core/draft-release-current.json
          python3 -c 'import json; d=json.load(open(".media-core/draft-release-current.json")); r=json.load(open(".media-core/release/core-receipt.json")); assert d["draft"] is True and d["tag_name"]==r["version"] and d["target_commitish"]==r["build"]["revision"], "Draft build identity changed"; assert r["validation"]["status"]=="passed", "Current QA must pass before publication"'
          gh release download "$CORE_TAG" --pattern core-receipt.json --dir .media-core/draft-identity
          python3 -c 'import json; before=json.load(open(".media-core/draft-identity/core-receipt.json")); after=json.load(open(".media-core/release/core-receipt.json")); assert before["validation"]["status"]=="awaiting-real-browser-verification"; assert all(before[k]==after[k] for k in ["version","binaries","source","notices","inputs","build"]), "Draft artifact identity differs from tested binary/source"'
          # 仅更新尚未公开草稿的 QA 收据/证据；原 JS/WASM/源码/输入锁不覆盖，已公开版本永不复用。
          gh release upload "$CORE_TAG" --clobber \
            .media-core/release/core-receipt.json \
            .media-core/release/media-core-codec-probes.json \
            .media-core/release/media-core-browser-results.json \
            .media-core/release/media-core-probe-source.mjs \
            .media-core/release/probe-h264.h264 .media-core/release/probe-mp3.mp3 .media-core/release/probe-aac.aac
          gh release edit "$CORE_TAG" --title "ParallelLines media core $CORE_TAG" \
            --notes 'Validated active-UI H264/MP3/AAC/WAV paths with complete corresponding source. HEVC single-thread encoding is a documented pre-existing unsupported path; no compiled codec was removed.' --draft=false
      - name: Close this job-owned builder
        if: always()
        shell: bash
        # 准备阶段失败时构建器可能尚未建立；清理失败不改变前面真实的构建/测试状态。
        run: docker buildx rm pl-media-core || true
