name: Toolbox checks

# 新仓库不沿用 OmniTools 的 DockerHub/Netlify 发布目标；部署和核心构建走专属受控工作流。
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=2 --minWorkers=1
      - run: npm run build
